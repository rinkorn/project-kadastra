[project]
name = "kadastra"
version = "0.1.0"
description = "Cadastral valuation on H3 hexagonal grid (pilot region: Tatarstan)"
readme = "README.md"
authors = [
    { name = "AlbM", email = "rinkorn.alb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.96",
    "catboost>=1.2.10",
    "fastapi>=0.136.1",
    "h3>=4.4.2",
    "httpx>=0.28.1",
    "interpret>=0.7.8",
    "jinja2>=3.1.6",
    "mlflow-skinny>=3.11.1",
    "networkx>=3.4",
    "polars>=1.40.1",
    "pydantic-settings>=2.14.0",
    "pyproj>=3.7.2",
    "python-multipart>=0.0.26",
    "rasterio>=1.5.0",
    "scikit-learn>=1.8.0",
    "shapely>=2.1.2",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.17.0",
    "moto[s3]>=5.1.22",
    "pre-commit>=4.6.2",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Russian-language project: cadastral data (NSPD/EГРН), ADRs and inline
# comments use Cyrillic on purpose. RUF001/RUF002/RUF003 flag every
# Cyrillic letter that has a confusable Latin glyph as 'ambiguous' —
# pure noise for this codebase, not a real defect class to enforce.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
# scripts/ — one-off ETL/import scripts, intentionally out of the strict
# type-check scope (see info/dev-rules.md). `exclude` filters them for
# both `uv run pyright` (uses `include`) and `uv run pyright .`.
exclude = [".venv", "**/__pycache__", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
# FastAPI route handlers look unused to pyright; the decorator does the registration.
reportUnusedFunction = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.commitizen]
name = "cz_conventional_commits"
# commitizen v4's default `commit_parser` for cz_conventional_commits already
# accepts the full Angular type list used here (feat/fix/perf/build/ci/docs/
# style/refactor/test/chore), so no change_type_map override is needed — the
# pre-commit `commitizen` hook validates messages against that pattern as-is.
