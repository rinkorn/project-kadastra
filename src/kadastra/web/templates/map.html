// ---------- rendering ----------

function renderHex(payload) {
  const stat = document.getElementById('stat');
  if (payload.data.length === 0) {
    stat.textContent = '0 hexes';
    deckOverlay.setProps({ layers: [] });
    setLegend(null);
    return;
  }
  const isCategorical = payload.is_categorical;
  let getFillColor;
  let oorFlag = () => false;
  let data = payload.data;
  if (isCategorical) {
    getFillColor = d => categoryColor(String(d.value));
  } else {
    const scaler = buildScaler(
      data.map(d => d.value),
      document.getElementById('scale').value,
      { lo: customLo, hi: customHi },
    );
    // Out-of-range = data value strictly outside user clamps. Auto
    // (un-clamped) extents never count as out-of-range.
    oorFlag = d => (customLo != null && d.value < customLo)
                || (customHi != null && d.value > customHi);
    if (oorMode === 'hide') data = data.filter(d => !oorFlag(d));
    const alpha = PALETTE_FILL_ALPHA[seqPaletteId] ?? userFillAlpha;
    getFillColor = d => {
      const c = rampColor(activeSeqRamp(), scaler.normalize(d.value), alpha);
      if (oorMode === 'dim' && oorFlag(d)) c[3] = Math.round(c[3] * 0.25);
      // «Стоимость типового объекта»: cells without sample objects are
      // pure model extrapolation — dim them so coverage reads at a glance.
      // Toggleable via the «dim» chip in the legend.
      if (dimUncoveredCells && payload.dim_uncovered && d.covered === false) c[3] = Math.round(c[3] * 0.35);
      return c;
    };
  }
  const layer = new deck.H3HexagonLayer({
    id: 'hex',
    data,
    getHexagon: d => d.hex,
    getFillColor,
    // updateTriggers force deck.gl to re-evaluate getFillColor when
    // palette state OR custom-clamp bounds change — without this the
    // hex buffer is cached against the (unchanged) data array ref.
    updateTriggers: {
      getFillColor: [seqPaletteId, seqReverse, isCategorical,
                     customLo, customHi, userFillAlpha,
                     seqColorFrom, seqColorTo, oorMode,
                     dimUncoveredCells,
                     document.getElementById('scale').value],
    },
    stroked: true,
    getLineColor: [0, 0, 0, 60],
    lineWidthMinPixels: 0.5,
    extruded: false,
    pickable: true,
    onClick: ({ object }) => object && handleHexClick(object, payload),
  });
  deckOverlay.setProps({
    layers: [layer, ...selectionOverlayLayers()],
    getTooltip: ({ object }) => object &&
      `${labelFeature(payload.feature) || payload.feature}: ${formatValue(object.value)}` +
      (object.covered === false ? '\nнет объектов-образцов (экстраполяция)' : ''),
  });
  stat.textContent = `${data.length.toLocaleString()} hexes (${labelFeature(payload.feature) || payload.feature}, ${payload.asset_class})`;
  setLegend({ payload, isCategorical, values: payload.data.map(d => d.value) });
}

function renderObjects(payload) {
  const stat = document.getElementById('stat');
  const rawData = payload.data;
  const mode = document.getElementById('object_mode').value;
  let data = rawData.filter(d => d[mode] !== null && d[mode] !== undefined);
  if (data.length === 0) {
    stat.textContent = `0 objects (${mode} all-null — train OOF artifact may be missing for ${payload.asset_class})`;
    deckOverlay.setProps({ layers: [] });
    setLegend(null);
    return;
  }
  let getFillColor;
  let isDiverging = false;
  let isCategorical = false;
  // Out-of-range predicate: data with the active mode value strictly
  // outside the user clamps. Auto (un-clamped) extents never count.
  // Diverging mode: |v| > |clampMax| where clampMax is the symmetric
  // bound derived from whichever endpoint the user typed in.
  let oorFlag = () => false;
  // Active palette ID — drives both the alpha override (transparent
  // fill) and the deck.gl updateTriggers below so the layer recolours
  // as soon as the user picks a new palette in the legend.
  let activePaletteId;
  if (mode === 'fold_id') {
    isCategorical = true;
    getFillColor = d => categoryColor('fold_' + d.fold_id);
    activePaletteId = 'categorical';
  } else if (mode === 'residual') {
    isDiverging = true;
    activePaletteId = divPaletteId;
    const scaler = buildDivergingScaler(
      data.map(d => d[mode]),
      { lo: customLo, hi: customHi },
    );
    const candidates = [customLo, customHi]
      .filter(v => v != null).map(v => Math.abs(v));
    if (candidates.length > 0) {
      const clampMax = Math.max(...candidates);
      oorFlag = d => Math.abs(d[mode]) > clampMax;
    }
    const alpha = PALETTE_FILL_ALPHA[divPaletteId] ?? userFillAlpha;
    getFillColor = d => rampColor(activeDivRamp(), scaler.normalize(d[mode]), alpha);
  } else {
    activePaletteId = seqPaletteId;
    const scaler = buildScaler(
      data.map(d => d[mode]),
      document.getElementById('scale').value,
      { lo: customLo, hi: customHi },
    );
    oorFlag = d => (customLo != null && d[mode] < customLo)
                || (customHi != null && d[mode] > customHi);
    const alpha = PALETTE_FILL_ALPHA[seqPaletteId] ?? userFillAlpha;
    getFillColor = d => rampColor(activeSeqRamp(), scaler.normalize(d[mode]), alpha);
  }
  if (!isCategorical && oorMode === 'hide') {
    data = data.filter(d => !oorFlag(d));
  }
  // Split rows by geometry availability: objects with a footprint
  // render as PolygonLayer (fill + bright outline); the rest fall
  // back to small dots so they're not invisible. Same getFillColor
  // closure feeds both layers — colour mapping stays consistent.
  const withPolygon = data.filter(d => d.geometry && d.geometry.coordinates);
  const withoutPolygon = data.filter(d => !d.geometry || !d.geometry.coordinates);
  // Fill alpha mirrors the palette default but is forced to 0 for the
  // `transparent` palette so the polygon reads as a wireframe (only
  // outline visible). Outline alpha stays full regardless.
  const fillAlpha = PALETTE_FILL_ALPHA[activePaletteId] ?? userFillAlpha;
  // Dim multiplier for out-of-range data when oorMode === 'dim'. Both
  // fill and outline get knocked down so the dimmed object reads as a
  // ghost shape, not a wireframe-on-fill.
  const oorAlpha = a => oorMode === 'dim' ? Math.round(a * 0.25) : a;
  const fillWithAlpha = d => {
    const [r, g, b] = getFillColor(d);
    const a = !isCategorical && oorFlag(d) ? oorAlpha(fillAlpha) : fillAlpha;
    return [r, g, b, a];
  };
  const lineFromFill = d => {
    const [r, g, b] = getFillColor(d);
    // Push toward white by ~35 % so the outline reads brighter than
    // the fill regardless of where the colour sits on the ramp.
    const lift = c => Math.min(255, Math.round(c + (255 - c) * 0.35));
    const a = !isCategorical && oorFlag(d) ? oorAlpha(255) : 255;
    return [lift(r), lift(g), lift(b), a];
  };
  // updateTriggers: re-evaluate accessors when palette state, custom
  // clamps OR scale mode changes. Without these, deck.gl reuses the
  // previously-bound colour buffer because the data array reference
  // is unchanged across recolours.
  const reverseKey = isDiverging ? divReverse : seqReverse;
  const colorFrom = isDiverging ? divColorFrom : seqColorFrom;
  const colorTo = isDiverging ? divColorTo : seqColorTo;
  const triggerKey = [activePaletteId, reverseKey,
                      customLo, customHi, userFillAlpha,
                      colorFrom, colorTo, oorMode,
                      document.getElementById('scale').value];
  const colorTriggers = { getFillColor: triggerKey, getLineColor: triggerKey };
  const layers = [];
  if (withPolygon.length > 0) {
    layers.push(new deck.PolygonLayer({
      id: 'objects-polygons',
      data: withPolygon,
      getPolygon: d => d.geometry.coordinates[0],
      getFillColor: fillWithAlpha,
      getLineColor: lineFromFill,
      updateTriggers: colorTriggers,
      lineWidthMinPixels: 1.5,
      stroked: true,
      filled: true,
      pickable: true,
      onClick: ({ object }) => object && handleObjectClick(object, payload.asset_class),
    }));
  }
  if (withoutPolygon.length > 0) {
    // Small dot as fallback for objects without a polygon footprint
    // (silver row missing geometry). Smaller than the old 14 m radius
    // so they read as «no footprint» rather than full circles.
    layers.push(new deck.ScatterplotLayer({
      id: 'objects-points',
      data: withoutPolygon,
      getPosition: d => [d.lon, d.lat],
      getFillColor: fillWithAlpha,
      radiusUnits: 'meters',
      getRadius: 6,
      stroked: true,
      lineWidthMinPixels: 1.5,
      getLineColor: lineFromFill,
      updateTriggers: colorTriggers,
      pickable: true,
      onClick: ({ object }) => object && handleObjectClick(object, payload.asset_class),
    }));
  }
  deckOverlay.setProps({
    layers: [...layers, ...selectionOverlayLayers()],
    getTooltip: ({ object }) =>
      object &&
      `${payload.asset_class} ${object.object_id}\n${mode}: ${formatValue(object[mode])}`,
  });
  stat.textContent = `${data.length.toLocaleString()} / ${rawData.length.toLocaleString()} objects (${mode}, ${payload.asset_class})`;
  setLegend({
    payload: { feature: mode, asset_class: payload.asset_class },
    isCategorical, isDiverging,
    values: data.map(d => d[mode]),
  });
}

// ---------- selection overlay ----------

// Returns extra deck.gl layers that highlight the currently-selected
// object on top of whatever base layer (hex / scatter) is rendered.
// Right now: a stroked + lightly-filled PolygonLayer for the object's
// gold polygon (re-projected to WGS84 by /api/inspection/{id}). The
// polygon stays visible across mode/scale changes until another
// object is clicked.
function selectionOverlayLayers() {
  // Compare mode: A (blue) and B (amber) outlines + center badges.
  if (compareMode) {
    const layers = [];
    if (compareA && compareA.geometry) layers.push(...selectionHighlight(compareA.geometry.coordinates[0], [253, 224, 71], 'cmp-a'));
    if (compareA && compareA.center) layers.push(selectionLabel(compareA.center, 'A', [202, 138, 4], 'cmp-a-label'));
    if (compareB && compareB.geometry) layers.push(...selectionHighlight(compareB.geometry.coordinates[0], [96, 165, 250], 'cmp-b'));
    if (compareB && compareB.center) layers.push(selectionLabel(compareB.center, 'B', [37, 99, 235], 'cmp-b-label'));
    return layers;
  }
  if (!selectedItem) return [];
  const layers = [];
  if (selectedItem.geometry) layers.push(...selectionHighlight(selectedItem.geometry.coordinates[0], [253, 224, 71], 'selection'));
  else if (selectedItem.center) layers.push(selectionDot(selectedItem.center, 'selection-dot'));
  return layers;
}

// Two stacked polygons per highlight: a thick dark halo so the selection
// stands out against any base-layer fill, and a brighter outline + fill on
// top. Halo renders first → sits below.
function selectionHighlight(ring, color, id) {
  return [
    new deck.PolygonLayer({
      id: id + '-halo',
      data: [{ ring }],
      getPolygon: d => d.ring,
      getFillColor: [0, 0, 0, 0],      // halo carries no fill
      getLineColor: [15, 23, 42, 220], // slate-900 @ 86%
      lineWidthMinPixels: 6,
      stroked: true,
      filled: false,
      pickable: false,
    }),
    new deck.PolygonLayer({
      id: id + '-poly',
      data: [{ ring }],
      getPolygon: d => d.ring,
      getFillColor: [color[0], color[1], color[2], 130],
      getLineColor: [color[0], color[1], color[2], 255],
      lineWidthMinPixels: 3,
      stroked: true,
      filled: true,
      pickable: false,
    }),
  ];
}

// A/B badge drawn at the item's center so the two selections can't be
// confused. Background colour matches the outline (A blue, B amber).
function selectionLabel(position, text, bg, id) {
  return new deck.TextLayer({
    id,
    data: [{ position, text }],
    getPosition: d => d.position,
    getText: d => d.text,
    getSize: 14,
    getColor: [255, 255, 255, 255],
    getBackgroundColor: [bg[0], bg[1], bg[2], 235],
    getPadding: [4, 4],
    getTextAnchor: 'middle',
    getAlignmentBaseline: 'center',
    pickable: false,
  });
}

// Ring marker for a selected object that has no polygon footprint.
function selectionDot(center, id) {
  return new deck.ScatterplotLayer({
    id,
    data: [{ position: center }],
    getPosition: d => d.position,
    radiusUnits: 'meters',
    getRadius: 50,
    stroked: true,
    filled: false,
    getLineColor: [253, 224, 71, 255],
    getFillColor: [0, 0, 0, 0],
    lineWidthMinPixels: 3,
    pickable: false,
  });
}

function redrawWithSelection() {
  if (!lastDataset) return;
  if (lastDataset.kind === 'hex') renderHex(lastDataset.payload);
  else renderObjects(lastDataset.payload);
}

// ---------- inspector panel ----------

async function showHexInspector(hex, payload) {
  // Unified hex inspector (ADR-0029 restructure): a click on a cell
  // shows EVERY data family present for that h3_index, in a fixed
  // section order — Рынок и модель (Слой 2 aggregates), Стоимость (EBM
  // valuation variants + terms), ЦОФ местности (Слой 1 raw sets).
  // Absent families are skipped; the active mode's section leads.
  showPanel();
  selectedItem = hexSelection(hex, payload);
  redrawWithSelection();
  const panel = document.getElementById('panel-content');
  panel.innerHTML = `<h2>Loading cell ${escapeHtml(hex.hex)}…</h2>`;
  const ac = payload.asset_class;
  const cellRes = (featureOptions || {}).cell_tsorf_resolution || 10;
  // Aggregates support the 'all' roll-up; valuation needs a concrete class.
  const hasAgg = ac && ac !== 'grid';
  const hasClass = ac && ac !== 'grid' && ac !== 'all';
  const [agg, val, tsorf] = await Promise.all([
    hasAgg ? fetchHexDetail(hex.hex, payload.resolution, ac) : Promise.resolve(null),
    hasClass ? fetchCellValuationDetail(hex.hex, ac) : Promise.resolve(null),
    fetchCellDetail(hex.hex, cellRes),
  ]);
  const hasVal = val && Object.keys(val).length > 0;
  const hasTsorf = tsorf && Object.keys(tsorf).length > 0;
  if (!agg && !hasVal && !hasTsorf) {
    panel.innerHTML = `<h2>Cell inspector</h2><p class="empty">Нет данных по ячейке ${escapeHtml(hex.hex)}.</p>`;
    return;
  }
  const mode = payload.source || (payload.valuation ? 'valuation' : 'agg');
  const order = mode === 'tsorf' ? ['tsorf', 'valuation', 'agg']
    : mode === 'valuation' ? ['valuation', 'agg', 'tsorf']
    : ['agg', 'valuation', 'tsorf'];
  const parts = [`<h2>Cell inspector — h3 ${escapeHtml(hex.hex)}</h2>`];
  if (agg && order.includes('agg')) {
    parts.push(`<h2>Рынок и модель</h2>`, renderHexDetailSections(agg));
  }
  if (hasVal && order.includes('valuation')) {
    parts.push(`<h2>Стоимость (EBM)</h2>`, renderCellValuationSections(val));
    const termsCtx = { h3: hex.hex, assetClass: ac };
    const terms = cellTermsSection(val, termsCtx);
    if (terms) parts.push(terms);
    wireCellTermsToggle(val, termsCtx);
  }
  if (hasTsorf && order.includes('tsorf')) {
    parts.push(`<h2>ЦОФ местности</h2>`, renderCellTsorfSections(tsorf));
  }
  panel.innerHTML = parts.join('');
}

// Group the full aggregate row into readable sections. Naming-convention
// driven, so newly-added aggregate columns land in a sensible bucket (or
// the "Прочее" fallback) without editing this list by hand. Shared by the
// single-hex inspector and the two-hex comparison table.
function hexGroupedKeys(detail) {
  const summaryKeys = [
    'h3_index', 'resolution', 'asset_class', 'count',
    'median_target_rub_per_m2', 'median_pred_oof_rub_per_m2', 'median_residual_rub_per_m2',
  ];
  const groups = [{ title: 'Сводка', keys: summaryKeys.filter(k => k in detail) }];
  const defs = [
    { title: 'Административная принадлежность', match: k => k.startsWith('dominant_') },
    { title: 'Описатели зданий', match: k => ['mean_levels', 'mean_flats', 'mean_area_m2', 'mean_year_built', 'mean_age_years'].includes(k) },
  ];
  const consumed = new Set(summaryKeys);
  for (const g of defs) {
    const keys = Object.keys(detail).filter(k => !consumed.has(k) && g.match(k)).sort();
    if (!keys.length) continue;
    keys.forEach(k => consumed.add(k));
    groups.push({ title: g.title, keys });
  }
  const rest = Object.keys(detail).filter(k => !consumed.has(k)).sort();
  if (rest.length) groups.push({ title: 'Прочее', keys: rest });
  return groups;
}

function renderHexDetailSections(detail) {
  return hexGroupedKeys(detail)
    .map(g => {
      const rows = g.keys.map(k => {
        const label = ADMIN_KEY_LABELS[k] || labelFeature(k) || k;
        return [label, formatValue(detail[k]), k];
      });
      return `<h2>${g.title}</h2>` + rowsSection(g.title === 'Сводка' ? 'summary' : '', rows);
    })
    .join('');
}

// ADR-0027: Russian labels for the six Слой 1 feature sets. Drives the
// section headings of the cell inspector so a reader sees «Метро» /
// «Дистанции (прямые)» rather than the raw set slugs. Order is fixed so
// the inspector layout is stable regardless of dict key order.
const CELL_TSORF_SET_LABELS = {
  geom_distance: 'Дистанции (прямые)',
  poly_area: 'Доли площади в буфере',
  zonal: 'Зональная плотность',
  road_density: 'Дорожная плотность',
  metro: 'Метро',
  walk_dist: 'Пешеходные дистанции по графу',
  enrichment: 'Обогащение (рельеф, дороги, охранные зоны)',
};

// Sections of raw Слой 1 sets for the unified hex inspector — the cell
// analog of renderHexDetailSections.
function renderCellTsorfSections(detail) {
  const known = Object.keys(CELL_TSORF_SET_LABELS);
  const present = Object.keys(detail);
  // Known sets first (in their fixed order), then any unexpected sets
  // alphabetically — newly added sets still render without code change.
  const ordered = [
    ...known.filter(fs => present.includes(fs)),
    ...present.filter(fs => !(fs in CELL_TSORF_SET_LABELS)).sort(),
  ];
  return ordered.map(fs => {
    const label = CELL_TSORF_SET_LABELS[fs] || fs;
    const rows = Object.keys(detail[fs]).sort().map(f => featureRow(f, formatValue(detail[fs][f])));
    return `<h2>${escapeHtml(label)}</h2>` + rowsSection('cell', rows);
  }).join('');
}

// «Why this location score»: locational EBM term contributions.
// Stored on the «default» variant only — the decomposition is
// variant-independent. Row markup shared with explanationSection.
//
// Two views over the same block:
// - collapsed (default): the stored top-N terms. The score itself sums
//   ALL locational terms, so a closing «среднее + остальные термы»
//   head row (= score − Σ shown) keeps the block reconciled.
// - expanded: every locational term, fetched on demand from
//   /api/cell_valuation/{h3}/explain (the store keeps only the top-N —
//   build_cell_valuation._TOP_TERMS_N). intercept + Σ all terms == the
//   score exactly, so the closing row is replaced by «среднее».
function cellTermsCollapsedHtml(holder) {
  const terms = holder.top_terms || [];
  const total = holder.location_score_rub_per_m2;
  const maxAbs = Math.max(...terms.map(t => Math.abs(t.contribution))) || 1;
  const shown = terms.reduce((s, t) => s + t.contribution, 0);
  const rest = total - shown;
  const totalTip = 'Итоговый локационный скор: среднее + Σ всех локационных вкладов (₽/м²). Объектные термы в скор не входят.';
  const restTip = `Среднее по классу плюс суммарный вклад локационных термов, не вошедших в топ-${terms.length}. Полный список — по кнопке «Показать все термы».`;
  const head = (total === null || total === undefined) ? ''
    : expHeadRow('location score', total, totalTip)
      + expHeadRow('среднее + остальные термы', rest, restTip);
  return head + terms.map(t => expFeatureRow(t.feature, t.contribution, maxAbs)).join('');
}

function cellTermsFullHtml(full) {
  const terms = full.terms || [];
  const maxAbs = Math.max(...terms.map(t => Math.abs(t.contribution))) || 1;
  const totalTip = 'Итоговый локационный скор: среднее + Σ всех локационных вкладов (₽/м²). Здесь показаны ВСЕ термы — сумма сходится точно.';
  const baseTip = 'Среднее (intercept) — базовая средняя цена за м² по этому классу, от которой отталкиваются локационные признаки.';
  return expHeadRow('location score', full.location_score, totalTip)
    + expHeadRow('среднее', full.intercept, baseTip)
    + terms.map(t => expFeatureRow(t.feature, t.contribution, maxAbs)).join('');
}

function cellTermsSection(detail, ctx) {
  const holder = detail.default || Object.values(detail).find(v => v && v.top_terms);
  const terms = (holder && holder.top_terms) || [];
  if (!terms.length) return '';
  return `<h2>Почему такой location score</h2>`
    + `<div class="exp-legend">Каждый вклад — насколько локационный признак двигает скор (₽/м²): <span class="exp-contrib pos">зелёный</span> прибавляет, <span class="exp-contrib neg">красный</span> убавляет. Показан топ-${terms.length} по модулю.</div>`
    + `<div class="exp-list" id="cell-exp-list">${cellTermsCollapsedHtml(holder)}</div>`
    + `<button class="exp-toggle" id="cell-exp-toggle" type="button">Показать все термы</button>`;
}

// Lazy expand/collapse for the cell terms block. The full decomposition
// is fetched once, then toggling is local. Must run after the panel's
// innerHTML is set (showHexInspector).
function wireCellTermsToggle(detail, ctx) {
  const btn = document.getElementById('cell-exp-toggle');
  const list = document.getElementById('cell-exp-list');
  if (!btn || !list) return;
  const holder = detail.default || Object.values(detail).find(v => v && v.top_terms);
  let full = null;
  let expanded = false;
  btn.addEventListener('click', async () => {
    if (!full) {
      btn.disabled = true;
      btn.textContent = 'Загрузка…';
      full = await fetchCellExplanation(ctx.h3, ctx.assetClass);
      btn.disabled = false;
      if (!full || !full.terms || !full.terms.length) {
        btn.textContent = 'Полная декомпозиция недоступна';
        return;
      }
    }
    expanded = !expanded;
    list.innerHTML = expanded ? cellTermsFullHtml(full) : cellTermsCollapsedHtml(holder);
    btn.textContent = expanded ? 'Свернуть' : 'Показать все термы';
  });
}

// «default» first (the class reference object), then ВРИ alternatives
// alphabetically; a short coverage note under sections with no samples.
function renderCellValuationSections(detail) {
  const variants = Object.keys(detail).sort((a, b) =>
    (a === 'default' ? -1 : b === 'default' ? 1 : a.localeCompare(b)));
  return variants.map(v => {
    const d = detail[v];
    const rows = [
      featureRow('reference_rub_per_m2', formatValue(d.reference_rub_per_m2)),
      featureRow('location_score_rub_per_m2', formatValue(d.location_score_rub_per_m2)),
      featureRow('n_sample_objects', formatValue(d.n_sample_objects)),
      featureRow('sample_covered', d.sample_covered ? 'да' : 'нет — нет объектов-образцов (экстраполяция)'),
    ];
    const title = v === 'default' ? 'default (эталон класса)' : `ВРИ: ${v}`;
    return `<h2>${escapeHtml(title)}</h2>` + rowsSection('cell', rows);
  }).join('');
}

async function showObjectInspector(obj, assetClass) {
  showPanel();
  const panel = document.getElementById('panel-content');
  panel.innerHTML = `<h2>Loading inspector for ${escapeHtml(obj.object_id)}…</h2>`;
  // Three parallel requests: per-active-model detail (geometry + full
  // gold features), quartet (4-model y_pred_oof for comparison), and
  // EMISS market reference (apartments only — null for other classes).
  const [detail, quartet, marketRef, explanation] = await Promise.all([
    fetchObjectDetail(obj.object_id, assetClass),
    fetchObjectQuartet(obj.object_id, assetClass),
    fetchMarketReference(assetClass),
    fetchObjectExplanation(obj.object_id, assetClass),
  ]);
  if (!detail) {
    panel.innerHTML = `<h2>Inspector</h2><p class="empty">Could not load detail for ${escapeHtml(obj.object_id)}.</p>`;
    return;
  }
  // Pull geometry off the dict before rendering rows: it's a structured
  // GeoJSON object, not a scalar — listing its raw JSON in the side
  // panel adds nothing for the human reader.
  delete detail.geometry;
  selectedItem = objectSelection(obj, assetClass);
  redrawWithSelection();
  const activeModel = document.getElementById('model').value;

  const sections = [];
  sections.push(`<h2>Object inspector — model: ${escapeHtml(activeModel)}</h2>`);
  // Summary first.
  const summary = ['object_id', 'asset_class', 'lat', 'lon', 'cad_num', 'readable_address',
    'mun_okrug_name', 'intra_city_raion', 'settlement_name', 'mun_source',
    'y_true', 'y_pred_oof', 'residual', 'fold_id'];
  const summaryRows = summary
    .filter(k => detail[k] !== undefined)
    .map(k => [ADMIN_KEY_LABELS[k] || labelFeature(k) || k, formatValue(detail[k]), k]);
  // Surface a one-line geometry status so the user knows whether the
  // map highlight comes from a real polygon or just a fallback dot.
  summaryRows.push([
    'geometry',
    selectedItem.geometry
      ? `Polygon (${selectedItem.geometry.coordinates[0].length - 1} vertices)`
      : '— (no silver polygon)',
  ]);
  sections.push(rowsSection('summary', summaryRows));
  // Geometry-derived ZOFs (ADR-0018) — promote to a dedicated section
  // so the human can read «компактность 0.78, ориентация 75°» without
  // hunting through the alphabetical "All features" dump.
  const geometrySection = renderGeometrySection(detail);
  if (geometrySection) {
    sections.push(`<h2>Геометрия объекта</h2>`);
    sections.push(geometrySection);
  }
  // 4-model side-by-side (ADR-0016). One row per model: y_pred_oof,
  // residual, |residual|/y_true as MAPE-style ratio. fold_id same
  // across models (single spatial split per ADR-0016) — surface once
  // outside the table to avoid noise.
  if (quartet && quartet.models) {
    sections.push(`<h2>Сравнение моделей</h2>`);
    sections.push(quartetSection(quartet, marketRef));
  }
  // EBM White Box explanation — why this object's price is what it is.
  const explanationBlock = explanationSection(explanation);
  if (explanationBlock) sections.push(explanationBlock);
  // Everything else — sorted alphabetically. Geometry-derived columns
  // are promoted to their own section above; exclude them here so they
  // don't show twice.
  const rest = Object.keys(detail)
    .filter(k => !summary.includes(k) && !GEOMETRY_FIELDS.includes(k))
    .sort()
    .map(k => featureRow(k, formatValue(detail[k])));
  if (rest.length) {
    sections.push(`<h2>All features</h2>`);
    sections.push(rowsSection('all', rest));
  }
  panel.innerHTML = sections.join('');
  wireExplanationToggle();
}

const GEOMETRY_FIELDS = [
  'polygon_area_m2',
  'polygon_perimeter_m',
  'polygon_compactness',
  'polygon_convexity',
  'bbox_aspect_ratio',
  'polygon_orientation_deg',
  'polygon_n_vertices',
];

// Group an object detail dict into comparison sections (summary + geometry
// + everything else). Mirrors the single-inspector layout so the two-item
// diff reads the same way.
function objectGroupedKeys(detail) {
  const summary = ['object_id', 'asset_class', 'lat', 'lon', 'cad_num', 'readable_address',
    'mun_okrug_name', 'intra_city_raion', 'settlement_name', 'mun_source',
    'y_true', 'y_pred_oof', 'residual', 'fold_id'];
  const groups = [];
  const s = summary.filter(k => k in detail);
  if (s.length) groups.push({ title: 'Сводка', keys: s });
  const geo = GEOMETRY_FIELDS.filter(k => k in detail);
  if (geo.length) groups.push({ title: 'Геометрия объекта', keys: geo });
  const consumed = new Set([...s, ...geo]);
  const rest = Object.keys(detail).filter(k => !consumed.has(k)).sort();
  if (rest.length) groups.push({ title: 'Прочее', keys: rest });
  return groups;
}

function renderGeometrySection(detail) {
  const present = GEOMETRY_FIELDS.filter(k => k in detail);
  if (!present.length) return '';
  const rows = present.map(k => featureRow(k, formatGeometryValue(k, detail[k])));
  return rowsSection('geometry', rows);
}

function formatGeometryValue(key, v) {
  if (v === null || v === undefined) return '—';
  if (key === 'polygon_n_vertices') return Math.round(v).toString();
  if (key === 'polygon_area_m2') return `${formatValue(v)} м²`;
  if (key === 'polygon_perimeter_m') return `${formatValue(v)} м`;
  if (key === 'polygon_orientation_deg') return `${v.toFixed(1)}°`;
  if (key === 'polygon_compactness' || key === 'polygon_convexity') {
    return v.toFixed(3);
  }
  if (key === 'bbox_aspect_ratio') return v.toFixed(2);
  return formatValue(v);
}

function rowsSection(cls, rows) {
  return `<div class="section ${cls}">` + rows.map(r => {
    const k = r[0], v = r[1], tipKey = r.length > 2 ? r[2] : k;
    const tip = labelTip(tipKey);
    return `<div class="row"><span class="key" data-tip="${escapeHtml(tip)}">${escapeHtml(k)}</span><span class="val">${escapeHtml(String(v))}</span></div>`;
  }).join('') + `</div>`;
}

// 4-model comparison table. Layout: model name + y_pred_oof + residual.
// Highlights the model currently selected in the topbar. Missing OOF
// for a model → "—" cell, not a hidden row.
//
// EMISS market reference (ADR-0010 anchor): apartments only — when
// available, two extra rows below y_true show вторичный/первичный
// рынок from EMISS-61781. The Δ column relative to y_true makes the
// «ЕГРН broken» gap visible at a glance.
function quartetSection(quartet, marketRef) {
  const yTrue = quartet.y_true;
  const activeModel = document.getElementById('model').value;
  const order = ['catboost', 'ebm', 'grey_tree', 'naive_linear'];
  const headerRow = `<div class="qrow qhead">
    <span class="qcell qmodel">model</span>
    <span class="qcell qval" data-tip="${escapeHtml(QUARTET_TIPS.y_pred_oof)}">y_pred_oof</span>
    <span class="qcell qval" data-tip="${escapeHtml(QUARTET_TIPS.residual)}">residual</span>
  </div>`;
  const dataRows = order.map(m => {
    const entry = quartet.models[m] || {};
    const isActive = m === activeModel ? ' qactive' : '';
    const tip = QUARTET_TIPS[m] || m;
    return `<div class="qrow${isActive}" data-tip="${escapeHtml(tip)}">
      <span class="qcell qmodel">${escapeHtml(m)}</span>
      <span class="qcell qval">${escapeHtml(formatValue(entry.y_pred_oof))}</span>
      <span class="qcell qval">${escapeHtml(formatValue(entry.residual))}</span>
    </div>`;
  }).join('');
  const yTrueTip = QUARTET_TIPS.y_true;
  const yTrueRow = `<div class="qrow qfoot" data-tip="${escapeHtml(yTrueTip)}">
    <span class="qcell qmodel">y_true (ЕГРН)</span>
    <span class="qcell qval">${escapeHtml(formatValue(yTrue))}</span>
    <span class="qcell qval"></span>
  </div>`;
  const marketRows = marketRefRows(marketRef, yTrue);
  return `<div class="section quartet">${headerRow}${dataRows}${yTrueRow}${marketRows}</div>`;
}

// EBM (White Box) explanation: top feature contributions as diverging
// bars (zero at the track centre — green grows right, red grows left).
// intercept + Σ contribution == the EBM prediction for the object.
//
// Row builders are shared with cellTermsSection (the cell location-score
// block) — one markup, one tooltip convention for every EBM
// decomposition the inspector renders.
const EXP_TOP_N = 25;

// One signed contribution row with a diverging bar.
function expRowHtml(label, tip, contribution, maxAbs) {
  const half = Math.round((Math.abs(contribution) / maxAbs) * 50);
  const pos = contribution >= 0;
  const barStyle = pos ? `left:50%;width:${half}%` : `right:50%;width:${half}%`;
  return `<div class="exp-row" data-tip="${escapeHtml(tip)}">
      <span class="exp-key">${escapeHtml(label)}</span>
      <span class="exp-contrib ${pos ? 'pos' : 'neg'}">${escapeHtml(formatDelta(contribution))}</span>
      <span class="exp-bar-track"><span class="exp-bar-zero"></span><span class="exp-bar ${pos ? 'pos' : 'neg'}" style="${barStyle}"></span></span>
    </div>`;
}

// Contribution row for a named feature: Russian label + raw-name tooltip.
function expFeatureRow(feature, contribution, maxAbs) {
  return expRowHtml(labelFeature(feature) || feature, labelTip(feature), contribution, maxAbs);
}

// Neutral head row (no sign, no bar) — totals and baselines sit above
// the signed contributions.
function expHeadRow(label, value, tip) {
  return `<div class="exp-row exp-row-base" data-tip="${escapeHtml(tip)}">
      <span class="exp-key">${escapeHtml(label)}</span>
      <span class="exp-contrib exp-neutral">${escapeHtml(formatValue(value))}</span>
      <span class="exp-bar-track"><span class="exp-bar-zero"></span></span>
    </div>`;
}

function explanationSection(explanation) {
  if (!explanation || !explanation.terms || !explanation.terms.length) return '';
  const intercept = explanation.intercept;
  const terms = [...explanation.terms].sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution));
  const maxAbs = Math.max(...terms.map(t => Math.abs(t.contribution))) || 1;
  const total = intercept + terms.reduce((s, t) => s + t.contribution, 0);
  const rowsHtml = (list) => list.map(t => expFeatureRow(t.feature, t.contribution, maxAbs)).join('');
  const top = terms.slice(0, EXP_TOP_N);
  const more = terms.length - top.length;
  const toggle = more > 0
    ? `<button class="exp-toggle" id="exp-toggle" type="button" data-total="${terms.length}">Показать все (${terms.length})</button>`
    : '';
  const net = total - intercept;
  const baseTip = 'Среднее (intercept) — базовая средняя цена за м² по этому классу, от которой отталкиваются признаки: зелёный вклад прибавляет, красный — убавляет. Формула: y_pred = среднее + Σ вкладов.';
  const yPredTip = 'Итоговый прогноз: y_pred = среднее + Σ всех вкладов. То, что модель предсказала для этого объекта (₽/м²).';
  // Neutral head rows — y_pred (total) then среднее (baseline) — no sign,
  // no green/red, both with the centre line the diverging bars reference.
  const head = expHeadRow('y_pred', total, yPredTip) + expHeadRow('среднее', intercept, baseTip);
  return `<h2>Объяснение цены (EBM)</h2>
    <div class="exp-base" data-tip="${escapeHtml(baseTip)}">y_pred = среднее + Σ вкладов = ${escapeHtml(formatValue(intercept))} + (${escapeHtml(formatDelta(net))})</div>
    <div class="exp-legend">Каждый вклад — насколько признак двигает цену от среднего (₽/м²): <span class="exp-contrib pos">зелёный</span> прибавляет, <span class="exp-contrib neg">красный</span> убавляет.</div>
    <div class="exp-list" id="exp-top">${head}${rowsHtml(top)}</div>
    <div class="exp-list exp-all" id="exp-all" style="display:none">${head}${rowsHtml(terms)}</div>
    ${toggle}`;
}

function wireExplanationToggle() {
  const btn = document.getElementById('exp-toggle');
  const top = document.getElementById('exp-top');
  const all = document.getElementById('exp-all');
  if (!btn || !top || !all) return;
  const totalLabel = btn.dataset.total || '';
  btn.addEventListener('click', () => {
    const collapsed = top.style.display !== 'none';
    top.style.display = collapsed ? 'none' : '';
    all.style.display = collapsed ? '' : 'none';
    btn.textContent = collapsed ? 'Свернуть' : `Показать все (${totalLabel})`;
  });
}

function marketRefRows(marketRef, yTrue) {
  if (!marketRef || !marketRef.data) return '';
  const data = marketRef.data;
  const year = marketRef.year;
  const rows = [];
  if (data.secondary_rub_per_m2 != null) {
    const delta = (yTrue != null)
      ? data.secondary_rub_per_m2 - yTrue
      : null;
    rows.push({
      label: `EMISS вторичный ${year}`,
      value: data.secondary_rub_per_m2,
      delta,
    });
  }
  if (data.primary_rub_per_m2 != null) {
    const delta = (yTrue != null)
      ? data.primary_rub_per_m2 - yTrue
      : null;
    rows.push({
      label: `EMISS первичный ${year}`,
      value: data.primary_rub_per_m2,
      delta,
    });
  }
  return rows.map(r => {
    const kind = r.label.includes('вторичный') ? 'secondary' : 'primary';
    const tip = `${QUARTET_TIPS[kind]}\n\nΔ = EMISS − y_true: насколько кадастровая оценка расходится с рыночной.`;
    return `<div class="qrow qmarket" data-tip="${escapeHtml(tip)}">
    <span class="qcell qmodel">${escapeHtml(r.label)}</span>
    <span class="qcell qval">${escapeHtml(formatValue(r.value))}</span>
    <span class="qcell qval">${escapeHtml(formatValue(r.delta))}</span>
  </div>`;
  }).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function formatValue(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    if (!Number.isFinite(v)) return String(v);
    if (Math.abs(v) >= 1000) return Math.round(v).toLocaleString();
    if (Math.abs(v) >= 1) return v.toFixed(2);
    // Small magnitudes (shares ~0.13, tiny deltas): cap to a few
    // significant digits so long floats don't overflow the columns.
    return String(Number(v.toPrecision(4)));
  }
  return String(v);
}

// ---------- compare mode (two items side by side) ----------
let compareMode = false;
let compareA = null; // { kind, label, geometry, center, fetch }
let compareB = null;
let compareActive = 'B'; // slot the next new click replaces
let compareData = null;  // { a, b, da, db } — last rendered comparison
let deltaSign = 1;       // +1 = B−A, -1 = A−B (toggled by clicking the Δ header)

// Convert an H3 cell index to a GeoJSON Polygon (WGS84 ring) so a selected
// hex can be outlined on the map the same way an object polygon is.
function h3BoundaryGeometry(h3Index) {
  if (typeof h3 === 'undefined' || !h3.cellToBoundary) return null;
  try {
    const ring = h3.cellToBoundary(h3Index).map(([lat, lng]) => [lng, lat]);
    if (!ring.length) return null;
    ring.push(ring[0]);
    return { type: 'Polygon', coordinates: [ring] };
  } catch (err) {
    return null;
  }
}

function h3Center(h3Index) {
  if (typeof h3 === 'undefined' || !h3.cellToLatLng) return null;
  try {
    const [lat, lng] = h3.cellToLatLng(h3Index);
    return [lng, lat];
  } catch (err) {
    return null;
  }
}

function hexSelection(hex, payload) {
  const isVal = !!payload.valuation;
  const isGrid = payload.asset_class === 'grid';
  return {
    // Valuation and ЦОФ details share the {group: {metric: value}}
    // shape — kind 'cell' makes compare-mode render both via
    // comparisonCellTable.
    kind: (isGrid || isVal) ? 'cell' : 'hex',
    label: hex.hex,
    geometry: h3BoundaryGeometry(hex.hex),
    center: h3Center(hex.hex),
    // Cells from ЦОФ (cell:*) features and from the valuation layer have
    // no hex_aggregates partition — fetch their own detail endpoints
    // instead so compare-mode works the same way single-inspector does.
    fetch: isVal
      ? () => fetchCellValuationDetail(hex.hex, payload.asset_class)
      : isGrid
        ? () => fetchCellDetail(hex.hex, payload.resolution)
        : () => fetchHexDetail(hex.hex, payload.resolution, payload.asset_class),
  };
}

function objectSelection(obj, assetClass) {
  const geometry = obj.geometry && obj.geometry.type === 'Polygon' ? obj.geometry : null;
  return {
    kind: 'object',
    label: obj.object_id,
    geometry,
    center: (obj.lon != null && obj.lat != null) ? [obj.lon, obj.lat] : null,
    fetch: async () => {
      const detail = await fetchObjectDetail(obj.object_id, assetClass);
      if (detail) delete detail.geometry; // structured, not a scalar — skip in the diff
      return detail;
    },
  };
}

function clearCompareSelections() {
  compareA = null;
  compareB = null;
  compareActive = 'B';
  compareData = null;
}

function resetCompare() {
  clearCompareSelections();
  selectedItem = null;
  redrawWithSelection();
  document.getElementById('panel-content').innerHTML =
    `<h2>Inspector</h2><p class="empty">Click on a hex or object to inspect.</p>`;
}

function handleHexClick(hex, payload) {
  if (compareMode) compareSelect(hexSelection(hex, payload));
  else showHexInspector(hex, payload);
}

function handleObjectClick(obj, assetClass) {
  if (compareMode) compareSelect(objectSelection(obj, assetClass));
  else showObjectInspector(obj, assetClass);
}

function compareSelect(sel) {
  showPanel();
  if (!compareA) {
    compareA = sel;
    compareB = null;
    compareActive = 'B';
    redrawWithSelection();
    document.getElementById('panel-content').innerHTML =
      `<h2>Сравнение</h2><p class="empty">Выбран <span class="cmp-a">A</span>: ${escapeHtml(sel.label)}.<br>Кликните второй элемент.</p>`;
    return;
  }
  if (!compareB) {
    compareB = sel;
    compareActive = 'B';
    redrawWithSelection();
    renderComparison();
    return;
  }
  // Both set. Clicking an already-selected item makes it the active slot
  // (the one the next new click replaces); a new item replaces the active.
  const key = selKey(sel);
  if (key === selKey(compareA)) {
    compareActive = 'A';
    renderCompareHeader();
    return;
  }
  if (key === selKey(compareB)) {
    compareActive = 'B';
    renderCompareHeader();
    return;
  }
  if (compareActive === 'A') compareA = sel; else compareB = sel;
  redrawWithSelection();
  renderComparison();
}

function selKey(sel) {
  return sel.kind + ':' + sel.label;
}

async function renderComparison() {
  const panel = document.getElementById('panel-content');
  const a = compareA;
  const b = compareB;
  panel.innerHTML = `<h2>Сравнение</h2><div id="cmp-header"></div><div id="cmp-table"><p class="empty">Загрузка…</p></div>`;
  const [da, db] = await Promise.all([a.fetch(), b.fetch()]);
  if (!da || !db) {
    panel.innerHTML = `<h2>Сравнение</h2><p class="empty">Не удалось загрузить данные для сравнения.</p>`;
    return;
  }
  compareData = { a, b, da, db };
  renderCompareHeader();
  document.getElementById('cmp-table').innerHTML = comparisonTable(da, db, a.kind);
}

function renderCompareHeader() {
  if (!compareData) return;
  const el = document.getElementById('cmp-header');
  if (!el) return;
  el.innerHTML = comparisonHeader(compareData.a, compareData.b);
  const reset = el.querySelector('#cmp-reset');
  if (reset) reset.addEventListener('click', resetCompare);
  const dt = el.querySelector('#cmp-delta-toggle');
  if (dt) dt.addEventListener('click', toggleDelta);
}

function toggleDelta() {
  deltaSign = -deltaSign;
  renderCompareHeader();
  const table = document.getElementById('cmp-table');
  if (table && compareData) table.innerHTML = comparisonTable(compareData.da, compareData.db, compareData.a.kind);
}

function comparisonHeader(a, b) {
  const aActive = compareActive === 'A';
  const bActive = compareActive === 'B';
  const deltaLabel = deltaSign === 1 ? 'B−A' : 'A−B';
  return `<div class="cmp-legend">
      <span class="cmp-legend-item cmp-a${aActive ? ' cmp-active' : ''}">${aActive ? '▸ ' : ''}A: ${escapeHtml(a.label)}</span>
      <span class="cmp-legend-item cmp-b${bActive ? ' cmp-active' : ''}">${bActive ? '▸ ' : ''}B: ${escapeHtml(b.label)}</span>
      <button id="cmp-reset" type="button" title="Сбросить сравнение">✕</button>
    </div>
    <div class="cmp-row cmp-head">
      <span class="cmp-key">показатель</span>
      <span class="cmp-val">A</span>
      <span class="cmp-val">B</span>
      <span class="cmp-delta cmp-delta-toggle" id="cmp-delta-toggle" title="Клик — поменять направление (B−A ⇄ A−B)">${deltaLabel}</span>
    </div>`;
}

function comparisonTable(da, db, kind) {
  if (kind === 'cell') return comparisonCellTable(da, db);
  const groups = kind === 'hex' ? hexGroupedKeys(da) : objectGroupedKeys(da);
  const out = [];
  for (const g of groups) {
    out.push(`<div class="cmp-section">${escapeHtml(g.title)}</div>`);
    for (const k of g.keys) {
      const label = ADMIN_KEY_LABELS[k] || labelFeature(k) || k;
      out.push(comparisonRow(label, da[k], db[k], k));
    }
  }
  return out.join('');
}

// Cell (Слой 1 ЦОФ) comparison: detail is nested
// {feature_set: {feature: value}}. Render sets in the fixed known
// order (then unknown alpha), each set as a section header followed
// by per-feature rows with a numeric Δ column. A feature present in
// only one cell renders null on the other side.
function comparisonCellTable(da, db) {
  const known = Object.keys(CELL_TSORF_SET_LABELS);
  const present = Object.keys(da);
  const sets = [
    ...known.filter(fs => present.includes(fs)),
    ...present.filter(fs => !(fs in CELL_TSORF_SET_LABELS)).sort(),
  ];
  const out = [];
  for (const fs of sets) {
    const label = CELL_TSORF_SET_LABELS[fs] || fs;
    out.push(`<div class="cmp-section">${escapeHtml(label)}</div>`);
    const aFeats = da[fs] || {};
    const bFeats = (db && db[fs]) || {};
    for (const f of Object.keys(aFeats).sort()) {
      // Structured passthroughs (top_terms_json etc.) are inspector
      // payloads, not comparable scalars — skip them in the diff.
      if (f.endsWith('_json')) continue;
      out.push(comparisonRow(labelFeature(f) || f, aFeats[f], bFeats[f], f));
    }
  }
  return out.join('');
}

function comparisonRow(key, va, vb, tipKey) {
  const fa = formatValue(va);
  const fb = formatValue(vb);
  const delta = numericDelta(va, vb);
  let deltaCell;
  if (delta === null) {
    deltaCell = '<span class="cmp-delta"></span>';
  } else {
    const cls = delta > 0 ? 'pos' : (delta < 0 ? 'neg' : '');
    deltaCell = `<span class="cmp-delta ${cls}">${formatDelta(delta)}</span>`;
  }
  const tip = labelTip(tipKey || key);
  // data-tip goes on the .cmp-row container, not the .cmp-key/.cmp-val
  // spans: those have overflow:hidden (for ellipsis) which clips the
  // ::after tooltip. The row is the smallest non-clipping ancestor.
  return `<div class="cmp-row" data-tip="${escapeHtml(tip)}">
      <span class="cmp-key">${escapeHtml(key)}</span>
      <span class="cmp-val">${escapeHtml(fa)}</span>
      <span class="cmp-val">${escapeHtml(fb)}</span>
      ${deltaCell}
    </div>`;
}

function numericDelta(va, vb) {
  if (typeof va === 'number' && typeof vb === 'number' && Number.isFinite(va) && Number.isFinite(vb)) {
    return (vb - va) * deltaSign;
  }
  return null;
}

function formatDelta(d) {
  const m = Math.abs(d);
  const s = m >= 1000 ? Math.round(m).toLocaleString() : (m >= 1 ? m.toFixed(2) : String(Number(m.toPrecision(4))));
  if (d > 0) return '+' + s;
  if (d < 0) return '-' + s;
  return '0';
}

function initCompareToggle() {
  const btn = document.getElementById('compare-toggle');
  if (!btn) return;
  btn.addEventListener('click', () => {
    compareMode = !compareMode;
    btn.classList.toggle('off', !compareMode);
    if (compareMode) {
      // Seamless: the current single selection becomes A (same amber).
      if (selectedItem) {
        compareA = selectedItem;
        compareActive = 'B';
        selectedItem = null;
        redrawWithSelection();
        document.getElementById('panel-content').innerHTML =
          `<h2>Сравнение</h2><p class="empty">Выбран <span class="cmp-a">A</span>: ${escapeHtml(compareA.label)}.<br>Кликните второй элемент.</p>`;
      }
    } else {
      // Seamless: A (amber) stays as the single selection; B is dropped.
      if (compareA) selectedItem = compareA;
      clearCompareSelections();
      redrawWithSelection();
      document.getElementById('panel-content').innerHTML =
        `<h2>Inspector</h2><p class="empty">Click on a hex or object to inspect.</p>`;
    }
  });
}

// ---------- legend ----------

function setLegend({ payload, isCategorical, isDiverging, values } = {}) {
  const legend = document.getElementById('legend');
  if (!payload) { legend.style.display = 'none'; return; }
  legend.style.display = '';
  document.getElementById('legend-feature').textContent =
    `${labelFeature(payload.feature) || payload.feature} (${payload.asset_class})`;
  const gradient = document.getElementById('legend-gradient');
  const gradientWrap = document.getElementById('legend-gradient-wrap');
  const swatches = document.getElementById('legend-swatches');
  const colorTicks = legend.querySelector('.ticks:not(.clamp-row)');
  const clampWrap = document.getElementById('legend-clamp-wrap');
  const clampTicks = document.getElementById('legend-clamp-ticks');
  if (isCategorical) {
    gradientWrap.style.display = 'none';
    colorTicks.style.display = 'none';
    clampWrap.style.display = 'none';
    clampTicks.style.display = 'none';
    swatches.style.display = 'flex';
    const uniq = [...new Set(values)].sort();
    swatches.innerHTML = uniq.map(v => {
      const [r, g, b] = categoryColor(String(v));
      return `<span><span class="swatch" style="background: rgb(${r},${g},${b})"></span>${escapeHtml(String(v))}</span>`;
    }).join('');
    document.getElementById('legend-palette-controls').style.display = 'none';
    document.getElementById('legend-opacity-row').style.display = 'none';
    renderPalettePicker(null);
    return;
  }
  swatches.style.display = 'none';
  // Top gradient: ALWAYS the full palette. The from/to thumbs cut a
  // sub-range out of it. The displayed gradient never changes when
  // the user clamps data lo/hi (those live below).
  const fullStops = isDiverging ? fullDivRamp() : fullSeqRamp();
  gradient.style.background = rampGradientCss(fullStops);
  gradientWrap.style.display = '';
  colorTicks.style.display = 'flex';
  const kind = isDiverging ? 'div' : 'seq';
  setColorRangeSliders(kind);
  // Bottom row: numeric data clamps, no gradient.
  clampWrap.style.display = '';
  clampTicks.style.display = 'flex';
  setLegendSliders(values, isDiverging);
  const reverseFlag = isDiverging ? divReverse : seqReverse;
  const controls = document.getElementById('legend-palette-controls');
  const reverseChip = document.getElementById('legend-reverse');
  controls.style.display = '';
  reverseChip.classList.toggle('active', reverseFlag);
  // Sync the opacity slider to the global state without stomping on
  // the active drag (focused element guard mirrors the lo/hi sliders).
  const alphaSlider = document.getElementById('legend-alpha');
  const alphaVal = document.getElementById('legend-alpha-val');
  document.getElementById('legend-opacity-row').style.display = '';
  // «dim» chip — только слой cell valuation (ячейки без образцов).
  document.getElementById('legend-dim-uncovered').style.display =
    (payload && payload.valuation) ? '' : 'none';
  if (document.activeElement !== alphaSlider) alphaSlider.value = String(userFillAlpha);
  alphaVal.textContent = String(userFillAlpha);
  renderPalettePicker(kind);
}

function setColorRangeSliders(kind) {
  const fromSlider = document.getElementById('legend-color-from');
  const toSlider = document.getElementById('legend-color-to');
  const fromVal = document.getElementById('legend-color-from-val');
  const toVal = document.getElementById('legend-color-to-val');
  const reset = document.getElementById('legend-color-reset');
  const fromT = kind === 'div' ? divColorFrom : seqColorFrom;
  const toT = kind === 'div' ? divColorTo : seqColorTo;
  if (document.activeElement !== fromSlider) fromSlider.value = String(Math.round(fromT * 100));
  if (document.activeElement !== toSlider) toSlider.value = String(Math.round(toT * 100));
  fromVal.textContent = `${Math.round(fromT * 100)}%`;
  toVal.textContent = `${Math.round(toT * 100)}%`;
  fromVal.classList.toggle('custom', fromT !== 0);
  toVal.classList.toggle('custom', toT !== 1);
  reset.classList.toggle('hidden', fromT === 0 && toT === 1);
}

// Configure the lo / hi range sliders based on the current layer's
// data extents. For diverging mode the slider track spans
// [-|maxAbs|, +|maxAbs|] so both thumbs share one symmetric scale;
// for sequential it spans [dataMin, dataMax]. Active thumb is left
// alone so a live drag doesn't snap on every recolour.
function setLegendSliders(values, isDiverging) {
  const minSlider = document.getElementById('legend-min');
  const maxSlider = document.getElementById('legend-max');
  const minVal = document.getElementById('legend-min-val');
  const maxVal = document.getElementById('legend-max-val');
  const finite = (values || []).filter(v => Number.isFinite(v));
  if (finite.length === 0) {
    minVal.value = ''; maxVal.value = '';
    minVal.placeholder = 'auto'; maxVal.placeholder = 'auto';
    return;
  }
  let trackMin, trackMax;
  if (isDiverging) {
    let m = 1;
    for (const v of finite) { const a = Math.abs(v); if (a > m) m = a; }
    trackMin = -m; trackMax = m;
  } else {
    // Iterate instead of Math.min(...finite)/Math.max(...finite): the
    // spread explodes the array as call args, which overflows the JS
    // call stack for large Слой 1 payloads (177k+ cells). See ADR-0027.
    trackMin = Infinity; trackMax = -Infinity;
    for (const v of finite) { if (v < trackMin) trackMin = v; if (v > trackMax) trackMax = v; }
    if (trackMin === trackMax) trackMax = trackMin + 1;
  }
  const span = trackMax - trackMin;
  const step = span / 1000;
  for (const s of [minSlider, maxSlider]) {
    s.min = String(trackMin); s.max = String(trackMax); s.step = String(step);
  }
  // Default thumb positions are the track extremes, so an unclamped
  // gradient shows both thumbs at the ends. Custom values override.
  const loVal = customLo != null ? customLo : trackMin;
  const hiVal = customHi != null ? customHi : trackMax;
  if (document.activeElement !== minSlider) minSlider.value = String(loVal);
  if (document.activeElement !== maxSlider) maxSlider.value = String(hiVal);
  // Number inputs share state with the sliders — don't stomp on the
  // user typing into them either. Empty + «auto» placeholder when the
  // user hasn't set a custom clamp, so clicking unrelated controls
  // (e.g. the oor chip) doesn't make the auto bounds look committed.
  minVal.placeholder = 'auto'; maxVal.placeholder = 'auto';
  if (document.activeElement !== minVal) {
    minVal.value = customLo != null ? numberForInput(customLo) : '';
  }
  if (document.activeElement !== maxVal) {
    maxVal.value = customHi != null ? numberForInput(customHi) : '';
  }
  minVal.classList.toggle('custom', customLo != null);
  maxVal.classList.toggle('custom', customHi != null);
  document.getElementById('legend-reset')
    .classList.toggle('hidden', customLo == null && customHi == null);
}

// Compact numeric formatting for `<input type=number>` — no commas
// (would invalidate the input), trims floating-point noise so the
// round-trip slider→input→slider doesn't drift.
function numberForInput(v) {
  if (!Number.isFinite(v)) return '';
  return Number(v.toPrecision(6)).toString();
}

// Palette picker: a custom dropdown. Collapsed state shows the
// currently-selected palette as a mini-gradient + name + caret. Click
// expands a popup menu listing all palettes (each = mini-gradient +
// name); click an option to select and close. Visually-driven pick.
// The menu previews the *effective* gradient — when reverse is on,
// the user sees mirrored mini-gradients so a new pick applies the
// same flip immediately. Hidden for categorical metrics.
function renderPalettePicker(kind) {
  const container = document.getElementById('legend-palette-picker');
  if (!kind) { container.innerHTML = ''; container.classList.remove('open'); return; }
  const ramps = kind === 'div' ? DIV_RAMPS : SEQ_RAMPS;
  const activeId = kind === 'div' ? divPaletteId : seqPaletteId;
  const reversed = kind === 'div' ? divReverse : seqReverse;
  const activeStops = maybeReverse(ramps[activeId] || Object.values(ramps)[0], reversed);
  const menuHtml = Object.entries(ramps).map(([id, stops]) => `
    <div class="opt${id === activeId ? ' active' : ''}"
         data-id="${id}" data-kind="${kind}"
         title="${id}${reversed ? ' (reversed)' : ''}">
      <div class="bar" style="background: ${rampGradientCss(maybeReverse(stops, reversed))}"></div>
      <div class="name">${id}</div>
    </div>
  `).join('');
  container.innerHTML = `
    <div class="current" data-kind="${kind}" title="${activeId}${reversed ? ' (reversed)' : ''}">
      <div class="bar" style="background: ${rampGradientCss(activeStops)}"></div>
      <div class="name">${activeId}</div>
      <div class="caret">▾</div>
    </div>
    <div class="menu">${menuHtml}</div>
  `;
  container.querySelector('.current').addEventListener('click', (ev) => {
    ev.stopPropagation();
    container.classList.toggle('open');
  });
  container.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = el.dataset.id;
      if (el.dataset.kind === 'div') divPaletteId = id;
      else seqPaletteId = id;
      container.classList.remove('open');
      recolor();
    });
  });
}

// Close the palette dropdown when clicking outside it.
document.addEventListener('click', (ev) => {
  const picker = document.getElementById('legend-palette-picker');
  if (picker && !picker.contains(ev.target)) {
    picker.classList.remove('open');
  }
});

// ---------- main ----------

async function refresh() {
  clearCompareSelections();
  const layer = document.getElementById('layer').value;
  // Four explicit modes, each with only the controls that make sense
  // for its data source:
  //   market    — Слой 2 aggregates: Feature + Resolution + class + Model
  //   tsorf     — Слой 1 raw ЦОФ: two-step Сет + Фича (fixed res,
  //               class/model-independent)
  //   valuation — ADR-0029 EBM layer: Metric + ВРИ + class (EBM fixed)
  //   object    — per-object scatter: Mode + class + Model
  const isMarket = layer === 'market';
  const isTsorf = layer === 'tsorf';
  const isVal = layer === 'valuation';
  const isObj = layer === 'object';
  const show = (id, on) => { document.getElementById(id).style.display = on ? '' : 'none'; };
  show('hex-feature-wrap', isMarket);
  show('cell-set-wrap', isTsorf);
  show('cell-feature-wrap', isTsorf);
  show('hex-resolution-wrap', isMarket);
  show('object-mode-wrap', isObj);
  show('model-wrap', isMarket || isObj);
  show('val-metric-wrap', isVal);
  document.getElementById('asset_class').parentElement.style.display = (isMarket || isVal || isObj) ? '' : 'none';
  // «Стоимость (EBM)»: ВРИ only when the class has real variants
  // (populateValVariants toggles its wrap).
  if (!isVal) show('val-variant-wrap', false);
  else populateValVariants();
  const stat = document.getElementById('stat');
  stat.textContent = 'loading…';
  try {
    if (isMarket) {
      const payload = await fetchHex();
      lastDataset = { kind: 'hex', payload };
      renderHex(payload);
    } else if (isTsorf) {
      const payload = await fetchCellTsorf();
      lastDataset = { kind: 'hex', payload };
      renderHex(payload);
    } else if (isVal) {
      const payload = await fetchCellValuation();
      lastDataset = { kind: 'hex', payload };
      renderHex(payload);
    } else {
      const payload = await fetchObjects();
      lastDataset = { kind: 'object', payload };
      renderObjects(payload);
    }
  } catch (e) {
    stat.textContent = `error: ${e.message}`;
    deckOverlay.setProps({ layers: [] });
    setLegend(null);
  }
}

// Re-render without re-fetching (e.g. mode/scale change).
function recolor() {
  if (!lastDataset) return;
  if (lastDataset.kind === 'hex') renderHex(lastDataset.payload);
  else renderObjects(lastDataset.payload);
}

['layer', 'asset_class', 'hex_feature', 'hex_resolution', 'model', 'val_metric', 'val_variant', 'cell_feature'].forEach(id =>
  document.getElementById(id).addEventListener('change', refresh)
);
// Сет change: repopulate the Фича select first, then re-render.
document.getElementById('cell_feature_set').addEventListener('change', () => {
  populateCellFeatures();
  refresh();
});
['object_mode', 'scale'].forEach(id =>
  document.getElementById(id).addEventListener('change', recolor)
);

// «dim» chip (legend, cell-valuation only): dim cells without sample
// objects (pure extrapolation) vs full colour. dimUncoveredCells is in
// the hex layer's updateTriggers, so recolor() repaints immediately.
const dimChip = document.getElementById('legend-dim-uncovered');
dimChip.addEventListener('click', () => {
  dimUncoveredCells = !dimUncoveredCells;
  dimChip.textContent = `dim: ${dimUncoveredCells ? 'on' : 'off'}`;
  dimChip.classList.toggle('active', dimUncoveredCells);
  recolor();
});

// Basemap toggle: flip the OSM raster layer's visibility. `off` makes
// the underlying canvas transparent so deck.gl polygons and hexes
// render against pure black — useful when the OSM tiles are visually
// noisy (lots of POI labels) and the user wants the data layer alone.
document.getElementById('basemap').addEventListener('change', (ev) => {
  const visibility = ev.target.value === 'off' ? 'none' : 'visible';
  map.setLayoutProperty('osm', 'visibility', visibility);
});

// Dual thumbs overlaid on the gradient fire 'input' on every drag
// tick → live clamp. Each thumb maps to its own state var; thumbs
// are constrained so lo ≤ hi (dragging one past the other pushes
// the other along by one step). × reset chip clears both.
function onLegendSliderInput(ev) {
  const minSlider = document.getElementById('legend-min');
  const maxSlider = document.getElementById('legend-max');
  const v = Number(ev.target.value);
  if (ev.target.id === 'legend-min') {
    customLo = v;
    if (customHi != null && customLo > customHi) customHi = customLo;
    else if (customHi == null && Number(maxSlider.value) < customLo) {
      customHi = customLo;
    }
  } else {
    customHi = v;
    if (customLo != null && customHi < customLo) customLo = customHi;
    else if (customLo == null && Number(minSlider.value) > customHi) {
      customLo = customHi;
    }
  }
  recolor();
}
['legend-min', 'legend-max'].forEach(id =>
  document.getElementById(id).addEventListener('input', onLegendSliderInput)
);
document.getElementById('legend-reset').addEventListener('click', () => {
  customLo = null;
  customHi = null;
  recolor();
});

// Number-input variant of lo/hi clamps. Typing a value (or pressing
// up/down) commits on `change` (blur or Enter); fed through the same
// state vars so sliders + inputs stay in sync via setLegendSliders.
function onLegendInputChange(ev) {
  const raw = ev.target.value;
  if (raw === '' || raw == null) {
    if (ev.target.id === 'legend-min-val') customLo = null;
    else customHi = null;
    recolor(); return;
  }
  const v = Number(raw);
  if (!Number.isFinite(v)) return;
  if (ev.target.id === 'legend-min-val') {
    customLo = v;
    if (customHi != null && customLo > customHi) customHi = customLo;
  } else {
    customHi = v;
    if (customLo != null && customHi < customLo) customLo = customHi;
  }
  recolor();
}
['legend-min-val', 'legend-max-val'].forEach(id =>
  document.getElementById(id).addEventListener('change', onLegendInputChange)
);

// Out-of-range mode: how data values outside [customLo, customHi]
// (or the data extents when unclamped) render. clamp = boundary
// colour (default), dim = alpha *= 0.25, hide = excluded entirely
// from the layer. Cycles on click. Stored globally; applied in both
// renderHex and renderObjects.
let oorMode = 'clamp';
const OOR_MODES = ['clamp', 'dim', 'hide'];
const oorChip = document.getElementById('legend-oor-mode');
oorChip.addEventListener('click', () => {
  oorMode = OOR_MODES[(OOR_MODES.indexOf(oorMode) + 1) % OOR_MODES.length];
  oorChip.textContent = `oor: ${oorMode}`;
  oorChip.classList.toggle('active', oorMode !== 'clamp');
  recolor();
});

// Live fill-opacity slider. Updates global state and recolours; the
// `transparent` palette ignores this and stays at alpha 0 because
// PALETTE_FILL_ALPHA wins in the renderers.
document.getElementById('legend-alpha').addEventListener('input', (ev) => {
  userFillAlpha = Number(ev.target.value);
  document.getElementById('legend-alpha-val').textContent = String(userFillAlpha);
  recolor();
});

// Reverse chip flips the palette in-place. Operates on whichever kind
// is active right now, so toggling under residual mode flips diverging
// only and a later switch back to a sequential metric still sees its
// own (un-reversed) state.
document.getElementById('legend-reverse').addEventListener('click', () => {
  if (!lastDataset) return;
  const mode = document.getElementById('object_mode').value;
  const isObj = lastDataset.kind === 'object';
  const isResidual = isObj && mode === 'residual';
  if (isResidual) divReverse = !divReverse;
  else seqReverse = !seqReverse;
  recolor();
});

// Active legend kind drives which palette/range state gets mutated by
// the legend controls below. Mirrors the inline check used by the
// reverse chip so the two stay in sync.
function activeLegendKind() {
  if (!lastDataset) return 'seq';
  if (lastDataset.kind === 'object'
      && document.getElementById('object_mode').value === 'residual') {
    return 'div';
  }
  return 'seq';
}

// Dual thumbs overlaid on the secondary gradient — pick the colour
// sub-range used to render. Constrained so from ≤ to (a thumb pushed
// past the other drags the other along). × reset chip clears both
// back to (0, 1).
function onColorRangeInput(ev) {
  const fromSlider = document.getElementById('legend-color-from');
  const toSlider = document.getElementById('legend-color-to');
  const v = Number(ev.target.value) / 100;
  const kind = activeLegendKind();
  let fromT = kind === 'div' ? divColorFrom : seqColorFrom;
  let toT = kind === 'div' ? divColorTo : seqColorTo;
  if (ev.target.id === 'legend-color-from') {
    fromT = v;
    if (fromT > toT) toT = fromT;
  } else {
    toT = v;
    if (toT < fromT) fromT = toT;
  }
  if (kind === 'div') { divColorFrom = fromT; divColorTo = toT; }
  else { seqColorFrom = fromT; seqColorTo = toT; }
  recolor();
}
['legend-color-from', 'legend-color-to'].forEach(id =>
  document.getElementById(id).addEventListener('input', onColorRangeInput)
);
document.getElementById('legend-color-reset').addEventListener('click', () => {
  const kind = activeLegendKind();
  if (kind === 'div') { divColorFrom = 0; divColorTo = 1; }
  else { seqColorFrom = 0; seqColorTo = 1; }
  recolor();
});

map.on('load', async () => {
  applyStaticTooltips();
  initTooltipToggle();
  applyPanelWidth();
  initPanelToggle();
  initPanelResizer();
  initCompareToggle();
  await loadFeatureOptions();
  applyFeatureOptionTooltips();
  await refresh();
});
</script>
</body>
</html>
