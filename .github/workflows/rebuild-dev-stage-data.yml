name: Rebuild dev-stage data

on:
  workflow_dispatch:

jobs:
  rebuild:
    name: Rebuild valuation_objects + hex_aggregates on dev-stage
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEV_STAGE_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_STAGE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ vars.DEV_STAGE_PORT }} ${{ vars.DEV_STAGE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build scripts image from current sources
        run: |
          # Scripts/ are baked into the image (only data/ is a volume), so
          # the image must be rebuilt before any download_* step can use
          # freshly deployed script changes.
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts build scripts"

      - name: Download current valuation_objects from S3
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/gold/valuation_objects \
               --dst data/gold/valuation_objects"

      - name: Download rebuild inputs from S3
        run: |
          # Everything build_object_features (CELL_TSORF_ENABLED=true) and
          # build_hex_aggregates read besides the gold objects:
          # - silver/features: the Слой 1 cell ЦОФ store joined per object
          # - silver/gar_lookup: GAR cadnum/municipality lookups
          # - raw/osm/kazan-agg-raions.geojsonseq: intra-city raion polygons
          # - models: OOF artifacts the hex aggregates join (latest quartet
          #   run per class is picked; the whole prefix is mirrored so the
          #   workflow stays correct as new runs land)
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/silver/features --dst data/silver/features && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/silver/gar_lookup --dst data/silver/gar_lookup && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/models --dst data/models && \
             docker compose --profile scripts run --rm scripts scripts/download_file_from_s3.py \
               --key Kadatastr/raw/osm/kazan-agg-raions.geojsonseq \
               --dst data/raw/osm/kazan-agg-raions.geojsonseq"

      - name: Rebuild object features
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm -e CELL_TSORF_ENABLED=true scripts scripts/build_object_features.py"

      - name: Rebuild hex aggregates
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/build_hex_aggregates.py"

      - name: Upload valuation_objects to S3
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/upload_dir_to_s3.py \
               --src data/gold/valuation_objects \
               --prefix Kadatastr/gold/valuation_objects"

      - name: Upload hex_aggregates to S3
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/upload_dir_to_s3.py \
               --src data/gold/hex_aggregates \
               --prefix Kadatastr/gold/hex_aggregates"

      - name: Restart dev-stage container to cold-pull fresh data
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose -p kadastra-dev-stage -f docker-compose.dev-stage.yml restart kadastra"

      - name: Fix data directory ownership for future CI/CD deploys
        run: |
          # The rebuild downloads inputs and writes outputs as root
          # (Docker) across data/ — gold, silver, models, raw. Re-own the
          # whole tree so the next deploy's rsync --delete can prune it.
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             mkdir -p data && \
             docker run --rm -v ./data:/data alpine chown -R \$(id -u):\$(id -g) /data"

      - name: Wait for healthcheck
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "for i in \$(seq 1 30); do
               if curl -fsS http://localhost:${{ vars.DEV_STAGE_INTERNAL_PORT }}/health > /dev/null 2>&1; then
                 echo 'Healthcheck passed'
                 exit 0
               fi
               sleep 5
             done
             echo 'Healthcheck did not pass after 150s' >&2
             docker compose -p kadastra-dev-stage -f ${{ env.DEPLOY_PATH }}/docker-compose.dev-stage.yml logs --tail=200 >&2
             exit 1"
