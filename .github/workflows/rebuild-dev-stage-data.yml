name: Rebuild dev-stage data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          full — весь пересчёт (изменились raw-слои/граф/silver-входы);
          hex-only — только hex_aggregates (переобучены модели или
          пересобраны valuation_objects, cell-фичи не тронуты);
          pull-only — артефакты уже на S3 (посчитано локально), runner
          ничего не считает: только VM pull + restart + healthcheck.
        type: choice
        options:
          - full
          - hex-only
          - pull-only
        default: full
        required: true

# Схема «VM = хостинг, compute — на GitHub-runner'е» (info/dev-rules.md):
# весь compute (скачивание входов, пересчёт cell ЦОФ / object features /
# hex aggregates, выгрузка результатов) идёт на ubuntu-latest runner'е
# напрямую через `uv run` — без docker и без занятой часами продажной
# машины. На VM по ssh остаётся только финал: забрать пересчитанные
# префиксы с S3 в data/ (docker compose scripts + download_dir_from_s3.py),
# restart контейнера, chown data/, healthcheck.
#
# Исключение — road graph: overpass-api.de режет GitHub runner IP по
# квоте (pull из CI = лотерея на 1,5+ часа), поэтому граф собирается
# локально (download_walking_network.py + build_road_graph_artifact.py)
# и заливается на S3 как ВХОД (Kadatastr/silver/road_graph). Для смены
# графа сначала обнови этот префикс, потом запускай workflow.
#
# Идемпотентность: download_dir_from_s3/upload_dir_to_s3 пропускают
# файлы с совпадающим размером, пересчёты детерминированы (raw-сброс
# схемы в BuildObjectFeatures и т.п.) — повторный запуск даёт тот же
# результат.
#
# Режимы (input `mode`): полный пересчёт нужен только когда изменились
# raw-слои, граф или silver-входы. Переобучение моделей затрагивает
# только hex_aggregates (objects + OOF) — для этого `hex-only` (~минуты
# вместо часов full). Если артефакты посчитаны локально и залиты на S3 —
# `pull-only`: runner вообще не считает, VM просто забирает префиксы.

jobs:
  rebuild:
    name: Rebuild valuation_objects + hex_aggregates on dev-stage
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: ${{ vars.DEV_STAGE_DEPLOY_PATH }}
      # Settings (src/kadastra/config.py) читает S3_* напрямую из env —
      # маппим DEV_STAGE_S3_* vars/secrets на них для всех compute-шагов
      # (scripts/download_*/upload_* берут конфиг из того же Settings).
      S3_ENDPOINT_URL: ${{ vars.DEV_STAGE_S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ vars.DEV_STAGE_S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.DEV_STAGE_S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.DEV_STAGE_S3_SECRET_KEY }}
      S3_REGION: ${{ vars.DEV_STAGE_S3_REGION }}
      S3_ADDRESSING_STYLE: ${{ vars.DEV_STAGE_S3_ADDRESSING_STYLE }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: ${{ github.event.inputs.mode != 'pull-only' }}
        run: uv sync --frozen

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_STAGE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ vars.DEV_STAGE_PORT }} ${{ vars.DEV_STAGE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Long steps (Overpass pull can run 10+ min) must not idle:
          # without SSH-level keepalives NATs/firewalls drop the session
          # mid-step ("client_loop: send disconnect: Broken pipe").
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 40\n' >> ~/.ssh/config

      - name: Download rebuild inputs from S3
        if: ${{ github.event.inputs.mode != 'pull-only' }}
        run: |
          set -euo pipefail
          # Everything build_object_features (CELL_TSORF_ENABLED=true) and
          # build_hex_aggregates read besides the gold objects:
          # - silver/features: the Слой 1 cell ЦОФ store joined per object
          # - silver/gar_lookup: GAR cadnum/municipality lookups
          # - silver/coverage: H3-гексы покрытия региона (res 7–11) —
          #   обязательный вход build_cell_metro_features /
          #   build_cell_graph_distance_features; на VM лежит в data/
          #   volume, на runner'е checkout её не содержит
          # - models: OOF artifacts the hex aggregates join (latest quartet
          #   run per class is picked; the whole prefix is mirrored so the
          #   workflow stays correct as new runs land)
          # - silver/road_graph: walking-graph artifact (edges.parquet).
          #   Собирается ВНЕ CI (локально: download_walking_network.py +
          #   build_road_graph_artifact.py + upload_dir_to_s3.py), т.к.
          #   overpass-api.de режет GitHub runner IP по квоте — pull из CI
          #   превращается в лотерею на 1,5+ часа (2026-08-21/22).
          # В режиме hex-only реально нужны только valuation_objects и
          # models, но префиксы качаются идемпотентно (size-skip) — проще
          # зеркалить всё, чем дробить шаг.
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/gold/valuation_objects \
            --dst data/gold/valuation_objects
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/silver/features --dst data/silver/features
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/silver/gar_lookup --dst data/silver/gar_lookup
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/silver/coverage --dst data/silver/coverage
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/models --dst data/models
          uv run python scripts/download_dir_from_s3.py \
            --prefix Kadatastr/silver/road_graph --dst data/silver/road_graph

      - name: Download raw OSM layers from S3
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          # - raions: intra-city raion polygons (build_object_features)
          # - water: ADR-0030 water-crossing filter (build_road_graph_artifact)
          #   + ADR-0032 water_share_*/dist_to_water_m cell ЦОФ
          # - park..railway: остальные poly_area/geom_distance слои
          #   (config.py) — входы build_cell_polygon_features и
          #   build_cell_geom_distance_features
          # - school..railway_station: point-POI слои walk_dist_layer_names —
          #   входы build_cell_graph_distance_features и
          #   build_isochrone_cache_per_hex (читают GeoJSON-seq с диска)
          for layer in \
            raions water \
            park forest industrial cemetery landfill powerline railway \
            school kindergarten clinic hospital pharmacy supermarket \
            cafe restaurant bus_stop tram_stop railway_station; do
            uv run python scripts/download_file_from_s3.py \
              --key "Kadatastr/raw/osm/kazan-agg-${layer}.geojsonseq" \
              --dst "data/raw/osm/kazan-agg-${layer}.geojsonseq"
          done

      - name: Download ADR-0022..0025 inputs from S3
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          # Opt-in входы build_object_features (ADR-0022..0025): DEM-растры,
          # road-class-per-object, heritage/ОКН, ЗОУИТ, macro-EMISS. С
          # 2026-08-21 зеркалятся на S3 (разовая заливка) — VM полностью
          # вышла из входов rebuild'а. Без этих префиксов блоки молча
          # скипаются и valuation_objects теряет колонки.
          for d in dem road_class_per_object heritage zouit_per_object macro_oktmo_features; do
            uv run python scripts/download_dir_from_s3.py \
              --prefix "Kadatastr/silver/$d" --dst "data/silver/$d"
          done

      - name: Rebuild graph-distance cell features (ADR-0030)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          # Everything computed off the road graph must be refreshed:
          # metro ЦОФ, walk_dist_to_* ЦОФ and the 15-min isochrone cache.
          # Сам граф — вход с S3 (собирается локально, см. шаг
          # "Download rebuild inputs"), в CI не пересчитывается.
          uv run python scripts/build_cell_metro_features.py
          uv run python scripts/build_cell_graph_distance_features.py
          uv run python scripts/build_isochrone_cache_per_hex.py

      - name: Rebuild polygon/geom-distance cell features (ADR-0019/0032)
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          # water_share_* / dist_to_water_m и остальные polygon/geom ЦОФ
          # зависят от raw-слоёв (водный слой меняется по ADR-0032) —
          # без этого шага ЦОФ-стор продолжал бы отдавать воду по
          # старому geojsonseq. Пишут в тот же silver/features, который
          # заливается шагом ниже.
          uv run python scripts/build_cell_polygon_features.py
          uv run python scripts/build_cell_geom_distance_features.py

      - name: Upload graph-distance features to S3
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          # silver/features was downloaded from S3 above, so re-uploading
          # the whole prefix only replaces the rebuilt metro/walk_dist/
          # polygon/geom-distance sets. road_graph не заливаем — он вход,
          # а не продукт этого workflow.
          uv run python scripts/upload_dir_to_s3.py \
            --src data/silver/features \
            --prefix Kadatastr/silver/features
          uv run python scripts/upload_dir_to_s3.py \
            --src data/silver/isochrone_cache \
            --prefix Kadatastr/silver/isochrone_cache

      - name: Rebuild object features
        if: ${{ github.event.inputs.mode == 'full' }}
        env:
          CELL_TSORF_ENABLED: "true"
        run: uv run python scripts/build_object_features.py

      - name: Rebuild hex aggregates
        if: ${{ github.event.inputs.mode != 'pull-only' }}
        run: uv run python scripts/build_hex_aggregates.py

      - name: Upload valuation_objects to S3
        if: ${{ github.event.inputs.mode == 'full' }}
        run: |
          uv run python scripts/upload_dir_to_s3.py \
            --src data/gold/valuation_objects \
            --prefix Kadatastr/gold/valuation_objects

      - name: Upload hex_aggregates to S3
        if: ${{ github.event.inputs.mode != 'pull-only' }}
        run: |
          uv run python scripts/upload_dir_to_s3.py \
            --src data/gold/hex_aggregates \
            --prefix Kadatastr/gold/hex_aggregates

      # --- Дальше только VM (хостинг): pull пересчитанных префиксов с S3,
      #     restart контейнера, chown, healthcheck. Compute на VM нет.
      #     Эти шаги выполняются во всех режимах, включая pull-only. ---

      - name: Build scripts image on VM
        run: |
          # Scripts/ are baked into the image (only data/ is a volume), so
          # the image must be rebuilt before the download_dir_from_s3 steps
          # below can use freshly deployed script changes.
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts build scripts"

      - name: Pull rebuilt prefixes from S3 on VM
        run: |
          # Compute уже отгрузил результаты на S3 — VM зеркалит их в свой
          # data/ тем же идемпотентным download_dir_from_s3 (size-match
          # skip). Cell ЦОФ, isochrone cache, valuation_objects,
          # hex_aggregates — продукты этого workflow; road graph — вход,
          # но VM тоже забирает его свежую версию с S3.
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/silver/road_graph --dst data/silver/road_graph && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/silver/features --dst data/silver/features && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/silver/isochrone_cache --dst data/silver/isochrone_cache && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/gold/valuation_objects --dst data/gold/valuation_objects && \
             docker compose --profile scripts run --rm scripts scripts/download_dir_from_s3.py \
               --prefix Kadatastr/gold/hex_aggregates --dst data/gold/hex_aggregates"

      - name: Restart dev-stage container to cold-pull fresh data
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose -p kadastra-dev-stage -f docker-compose.dev-stage.yml restart kadastra"

      - name: Fix data directory ownership for future CI/CD deploys
        run: |
          # The pull above writes into data/ as root (Docker). Re-own the
          # whole tree so the next deploy's rsync --delete can prune it.
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             mkdir -p data && \
             docker run --rm -v ./data:/data alpine chown -R \$(id -u):\$(id -g) /data"

      - name: Wait for healthcheck
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ vars.DEV_STAGE_PORT }} \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEV_STAGE_HOST }} \
            "for i in \$(seq 1 30); do
               if curl -fsS http://localhost:${{ vars.DEV_STAGE_INTERNAL_PORT }}/health > /dev/null 2>&1; then
                 echo 'Healthcheck passed'
                 exit 0
               fi
               sleep 5
             done
             echo 'Healthcheck did not pass after 150s' >&2
             docker compose -p kadastra-dev-stage -f ${{ env.DEPLOY_PATH }}/docker-compose.dev-stage.yml logs --tail=200 >&2
             exit 1"
